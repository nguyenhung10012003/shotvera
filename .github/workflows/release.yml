name: Release

# Builds Shotvera for macOS (Apple Silicon and Intel), Windows and Linux on GitHub's runners and
# attaches the installers to a GitHub Release.
#
# Trigger: push a version tag (`npm run release -- patch` does that), or run it manually from the
# Actions tab for a tag that already exists.
#
# The release is created as a draft and published only after every platform builds, so nobody
# ever sees a half-filled release. If a build fails, fix it and re-run the failed jobs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (for example v0.1.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check that the tag matches the app version
        run: |
          version=$(node -p "require('./package.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n1)
          if [ "$TAG" != "v$version" ] || [ "$cargo_version" != "$version" ]; then
            echo "::error::Tag $TAG, package.json ($version) and src-tauri/Cargo.toml ($cargo_version) must agree. Bump versions with 'npm run release'."
            exit 1
          fi

      - name: Create the draft release (or reuse it on a re-run)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            prerelease=false
            case "$TAG" in *-*) prerelease=true ;; esac
            notes=$(sed "s/{{version}}/${TAG#v}/g" .github/release-notes.md)
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Shotvera ${TAG#v}" -f body="$notes" \
              -F draft=true -F prerelease=$prerelease -F generate_release_notes=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
          - name: Linux
            # xcap's PipeWire bindings (pipewire/libspa 0.10) need PipeWire 1.x headers, which
            # Ubuntu 22.04 (0.3.48) lacks. Building on 24.04 means the packages need glibc 2.39+.
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Tauri (WebKitGTK, tray, bundling) + xcap (X11, PipeWire/Wayland capture).
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev \
            libwayland-dev libegl-dev libgbm-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Use Apple signing and notarization secrets, if configured
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Without these secrets the app is ad-hoc signed (bundle.macOS.signingIdentity = "-").
          # Export only the variables that are set: an empty one would make the bundler try to sign with nothing.
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
              echo "$v=${!v}" >> "$GITHUB_ENV"
            done
            echo "Signing with the Developer ID certificate."
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                echo "$v=${!v}" >> "$GITHUB_ENV"
              done
              echo "Notarizing with Apple."
            fi
          else
            echo "No signing certificate configured: ad-hoc signing."
          fi

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.create-release.outputs.release_id }}" -F draft=false --silent
